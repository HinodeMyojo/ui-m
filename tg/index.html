<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14151b" />
    <title>語 Японский</title>
    <!--
      Скрипт Telegram отдаётся со своего домена, а не с telegram.org. Из
      российских сетей telegram.org часто недоступен, а загрузка синхронная:
      телефон без VPN висел на ней белым экраном, и мини-апп не открывался
      вовсе (23.09.2026). Источник клиент Telegram не сверяет: скрипт лишь
      говорит с ним через postMessage/TelegramWebviewProxy. Копия лежит в
      public/tg/ — обновлять вручную, когда понадобятся новые методы API.

      Он же — единственный способ понять, что страницу открыли изнутри
      Telegram, а не по ссылке в браузере.

      Загрузка синхронная и до модуля приложения нарочно: window.Telegram
      должен существовать к первой строке main.js, иначе первый кадр рисуется
      с неправильной темой и без отступов под чёлку.
    -->
    <script src="/tg/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tg/main.js"></script>
  </body>
</html>
